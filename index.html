<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TimeValue Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f5f3f0;--white:#fff;--text:#1a1a1a;--t2:#666;--t3:#aaa;
--bdr:#e0dcd6;--bdr2:#eae7e2;
--blue:#b8d4ff;--purple:#d4c5f9;--pink:#ffc8dd;--mint:#c7f0db;--peach:#ffd6a5;--lav:#e7c6ff;
--fd:rgba(26,26,26,.12);--fm:rgba(26,26,26,.06);
--f:'Noto Sans JP',sans-serif;
}
html{font-size:14px;scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--text);line-height:1.6;font-weight:300;min-height:100vh;overflow-x:hidden}
.app{max-width:1400px;margin:0 auto;padding:0 2.5rem}
.hd{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.7rem 0;background:var(--bg);border-bottom:1px solid var(--bdr2)}
.logo{font-size:1.3rem;font-weight:900;letter-spacing:-.02em}
.logo-sub{font-size:.5rem;font-weight:300;color:var(--t3);letter-spacing:.2em;text-transform:uppercase;margin-left:.5rem}
.nav{display:flex;gap:1px;background:var(--bdr2);border-radius:4px;padding:1px}
.nav-b{padding:.3rem .85rem;font-family:var(--f);font-size:.65rem;font-weight:400;color:var(--t3);background:var(--bg);border:0;cursor:pointer;transition:all .15s}
.nav-b:first-child{border-radius:3px 0 0 3px}
.nav-b:last-child{border-radius:0 3px 3px 0}
.nav-b:hover{color:var(--text)}
.nav-b.on{color:var(--white);background:var(--text);font-weight:500}
.hero{display:flex;align-items:end;justify-content:space-between;gap:1.5rem;padding:2rem 0 1.5rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-20%;right:-60px;width:380px;height:160%;background:linear-gradient(135deg,rgba(184,212,255,.1),rgba(212,197,249,.15),rgba(255,200,221,.1));transform:skewX(-12deg);pointer-events:none}
.hero::after{content:'';position:absolute;top:10px;right:130px;width:120px;height:120px;border:1.5px solid var(--fd);transform:rotate(8deg);pointer-events:none}
.hero-left{flex:1;min-width:0;position:relative;z-index:1}
.hero-motto{font-size:2.4rem;font-weight:900;line-height:1.05;letter-spacing:.04em;margin-bottom:.25rem}
.hero-sub{font-size:.7rem;font-weight:300;color:var(--t2);letter-spacing:.03em}
.hero-edit-btn{font-family:var(--f);font-size:.48rem;color:var(--t3);background:0;border:0;cursor:pointer;margin-top:.25rem;text-decoration:underline;text-underline-offset:2px}
.hero-edit-btn:hover{color:var(--text)}
.hero-photo{position:relative;width:180px;height:115px;flex-shrink:0;z-index:1}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.92) contrast(1.05)}
.hero-photo::before{content:'';position:absolute;top:-6px;left:-6px;right:8px;bottom:8px;border:1.5px solid var(--fd);pointer-events:none}
.hero-photo::after{content:'';position:absolute;top:6px;left:8px;right:-6px;bottom:-6px;border:1px solid var(--fm);pointer-events:none}
.hero-line{position:absolute;bottom:8px;left:0;width:40px;height:2px;background:linear-gradient(90deg,var(--purple),transparent)}
.rule{position:relative;height:3px;overflow:hidden;margin-bottom:.8rem}
.rule::before{content:'';position:absolute;inset:0 -3%;background:linear-gradient(90deg,var(--purple),var(--blue),var(--pink),var(--peach),var(--mint));transform:skewX(-25deg)}
.mg{display:grid;grid-template-columns:1fr 240px;gap:1.5rem;align-items:start}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.st{font-size:.85rem;font-weight:700;position:relative;padding-left:.65rem}
.st::before{content:'';position:absolute;left:0;top:.1em;width:2.5px;height:.85em;background:var(--purple)}
.cg{margin-bottom:.4rem}
.cg-head{display:flex;align-items:center;justify-content:space-between;padding:.2rem .6rem;background:var(--white);border:1px solid var(--bdr2);border-bottom:0;font-size:.68rem;font-weight:600}
.cg-cnt{font-size:.55rem;font-weight:300;color:var(--t3)}
.tl{position:relative;margin-bottom:.5rem}
.tl::before{content:'';position:absolute;top:-7px;left:-7px;right:10px;bottom:10px;border:1.5px solid var(--fd);pointer-events:none;z-index:0}
.tl::after{content:'';position:absolute;top:7px;left:7px;right:-7px;bottom:-7px;border:1px solid var(--fm);pointer-events:none;z-index:0}
.tr{display:flex;align-items:center;gap:.4rem;background:var(--white);border:1px solid var(--bdr2);border-top:0;padding:.3rem .6rem;position:relative;z-index:1;transition:all .1s;cursor:pointer;font-size:.76rem}
.tr:first-child,.cg-head+.tr{border-top:1px solid var(--bdr2)}
.tr:hover{background:#faf9f7}
.tr.run{border-left:3px solid #5a8f6e}
.tr.done{opacity:.3}
.tr.done .tn{text-decoration:line-through}
.td-date{font-size:.58rem;font-weight:500;min-width:36px;flex-shrink:0;color:var(--purple)}
.td-date.overdue{color:#c77}
.td-date.today{color:#5a8f6e;font-weight:600}
.tn{font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt{display:inline-block;padding:.06rem .35rem;font-size:.5rem;font-weight:500;border-radius:1px;flex-shrink:0}
.tt-routine{background:var(--blue);color:#3a6db5}
.tt-strategic{background:var(--purple);color:#6b5a9e}
.tt-creative{background:var(--pink);color:#b5577a}
.tt-admin{background:var(--peach);color:#b58040}
.ttm{font-size:.68rem;font-weight:600;flex-shrink:0;min-width:28px;text-align:right;cursor:pointer;padding:.08rem .25rem;transition:background .15s}
.ttm:hover{background:rgba(212,197,249,.15)}
.ttm-ed{display:flex;align-items:center;gap:1px;flex-shrink:0}
.ttm-ed input{width:28px;font-family:var(--f);font-size:.65rem;font-weight:600;padding:.08rem .15rem;border:1px solid var(--purple);background:var(--white);outline:0;text-align:center}
.ttm-ed span{font-size:.55rem;color:var(--t3)}
.ta{display:flex;gap:2px;flex-shrink:0;align-items:center}
.bt{font-family:var(--f);font-size:.54rem;padding:.12rem .38rem;border:1px solid var(--bdr);background:var(--white);color:var(--t2);cursor:pointer;transition:all .1s;white-space:nowrap}
.bt:hover{background:var(--bg);color:var(--text)}
.bt-go{background:var(--mint);color:#3a7d5c;border-color:rgba(58,125,92,.12);font-weight:600}
.bt-go:hover{background:#a8e6c3}
.bt-st{background:var(--pink);color:#b5577a;border-color:rgba(181,87,122,.12);font-weight:600}
.bt-st:hover{background:#ffacc7}
.bt-done{background:var(--blue);color:#3a6db5;border-color:rgba(58,109,181,.12);font-weight:500}
.bt-done:hover{background:#9ec4ff}
.bt-undo{background:var(--lav);color:#7b5ea7;border-color:rgba(123,94,167,.12);font-weight:500}
.bt-undo:hover{background:#d4bff7}
.bt-x{color:#c77;border:0;background:0}
.te{display:flex;align-items:center;gap:.3rem;background:var(--white);border:1px solid var(--bdr2);border-top:0;padding:.18rem .6rem;position:relative;z-index:1;font-size:.55rem}
.sb-inner{position:sticky;top:55px}
.tw{background:var(--white);border:1px solid var(--bdr2);padding:.8rem;position:relative;z-index:1}
.tw::before{content:'';position:absolute;top:-6px;right:-6px;width:28px;height:28px;border:1.5px solid var(--fd);transform:rotate(12deg);pointer-events:none}
.tw::after{content:'';position:absolute;bottom:-5px;left:-5px;width:18px;height:18px;border:1px solid rgba(212,197,249,.3);transform:rotate(-8deg);pointer-events:none}
.tw-l{font-size:.48rem;font-weight:500;color:var(--t3);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.5rem}
.tw-n{font-size:.72rem;font-weight:600;margin-bottom:.05rem}
.tw-c{font-size:.55rem;color:var(--t3);margin-bottom:.3rem}
.tw-d{font-size:1.6rem;font-weight:700;text-align:center;padding:.2rem 0;letter-spacing:.04em}
.tw-d.on{color:#5a8f6e}
.tw-d.off{opacity:.12}
.tw-ctr{display:flex;justify-content:center;margin-top:.2rem}
.side-photo{margin-top:.8rem;position:relative;width:100%;height:90px;overflow:hidden}
.side-photo img{width:100%;height:100%;object-fit:cover;filter:brightness(.9)}
.side-photo::before{content:'';position:absolute;top:-5px;left:-5px;right:7px;bottom:7px;border:1.5px solid var(--fd);pointer-events:none;z-index:1}
.side-photo::after{content:'';position:absolute;top:5px;left:7px;right:-5px;bottom:-5px;border:1px solid var(--fm);pointer-events:none;z-index:1}
.btn{font-family:var(--f);font-size:.68rem;font-weight:400;padding:.35rem .9rem;border:1px solid var(--bdr);background:var(--white);color:var(--text);cursor:pointer;transition:all .2s}
.btn:hover{background:var(--text);color:var(--white);border-color:var(--text)}
.btn-p{background:var(--text);color:var(--white);border-color:var(--text)}
.btn-p:hover{background:#444}
.btn-s{padding:.22rem .55rem;font-size:.62rem}
.inp,.sel,.txa{font-family:var(--f);font-size:.76rem;font-weight:300;padding:.45rem .65rem;border:1px solid var(--bdr);background:var(--white);color:var(--text);width:100%;outline:0;transition:border-color .2s}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--t3)}
.txa{resize:vertical;min-height:45px;line-height:1.5}
.fl{display:block;font-size:.55rem;font-weight:500;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.2rem}
.fg{margin-bottom:.6rem}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.wd{display:flex;gap:2px}
.wd-b{width:26px;height:26px;border:1px solid var(--bdr);background:var(--white);color:var(--t2);font-size:.55rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--f);transition:all .1s}
.wd-b.on{background:var(--text);color:var(--white);border-color:var(--text);font-weight:600}
.mo-bg{position:fixed;inset:0;background:rgba(26,26,26,.3);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fi .12s}
.mo{background:var(--white);width:90%;max-width:460px;max-height:85vh;overflow-y:auto;padding:1.4rem;position:relative;box-shadow:0 16px 48px rgba(0,0,0,.12);animation:su .18s}
.mo::before{content:'';position:absolute;top:-8px;left:-8px;right:12px;bottom:12px;border:1.5px solid var(--fd);pointer-events:none}
.mo::after{content:'';position:absolute;top:6px;left:8px;right:-6px;bottom:-6px;border:1px solid var(--fm);pointer-events:none}
.mo-t{font-size:.95rem;font-weight:700;margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--bdr2)}
.mo-f{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.8rem;padding-top:.5rem;border-top:1px solid var(--bdr2)}
.motto-ed{background:var(--white);border:1px solid var(--bdr2);padding:.8rem 1rem;margin-bottom:.8rem;animation:su .15s}
.kpi{display:flex;background:var(--white);border:1px solid var(--bdr2);position:relative;margin-bottom:.7rem}
.kpi::before{content:'';position:absolute;top:-7px;left:-7px;right:10px;bottom:8px;border:1.5px solid var(--fd);pointer-events:none}
.kpi::after{content:'';position:absolute;top:6px;left:8px;right:-6px;bottom:-6px;border:1px solid var(--fm);pointer-events:none}
.kpi-i{flex:1;padding:.5rem 1rem;position:relative;z-index:1}
.kpi-i+.kpi-i{border-left:1px solid var(--bdr2)}
.kpi-i:nth-child(1){border-top:2px solid var(--blue)}
.kpi-i:nth-child(2){border-top:2px solid var(--purple)}
.kpi-i:nth-child(3){border-top:2px solid var(--mint)}
.kpi-l{font-size:.5rem;font-weight:500;color:var(--t3);letter-spacing:.12em;text-transform:uppercase}
.kpi-v{font-size:1.2rem;font-weight:700;line-height:1.2}
.kpi-u{font-size:.6rem;font-weight:300;color:var(--t2);margin-left:.1rem}
.rf{display:flex;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap;align-items:end}
.rtbl{width:100%;border-collapse:collapse}
.rtbl th{font-size:.55rem;font-weight:500;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:.35rem .6rem;border-bottom:2px solid var(--bdr)}
.rtbl td{font-size:.72rem;font-weight:300;padding:.35rem .6rem;border-bottom:1px solid var(--bdr2)}
.cb{background:var(--white);border:1px solid var(--bdr2);padding:.8rem;position:relative;z-index:1}
.cb::before{content:'';position:absolute;top:-6px;left:4px;right:-5px;bottom:5px;border:1.5px solid var(--fd);pointer-events:none;z-index:-1}
.cm{min-height:60px;max-height:200px;overflow-y:auto;margin-bottom:.4rem}
.cmb{padding:.4rem .7rem;margin-bottom:.3rem;font-size:.72rem;line-height:1.5;font-weight:300;max-width:85%;white-space:pre-line}
.cmb-u{background:var(--bg);border:1px solid var(--bdr2);margin-left:auto}
.cmb-a{background:var(--lav);opacity:.9;border:1px solid rgba(0,0,0,.03)}
.cr{display:flex;gap:.3rem}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem}
.dc{background:var(--white);border:1px solid var(--bdr2);padding:1rem;text-align:center}
.cl{background:var(--white);border:1px solid var(--bdr2);padding:.7rem .9rem;margin-bottom:.3rem;position:relative;cursor:grab;z-index:1}
.cl::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.cl:nth-child(4n+1)::before{background:var(--blue)}
.cl:nth-child(4n+2)::before{background:var(--purple)}
.cl:nth-child(4n+3)::before{background:var(--pink)}
.cl:nth-child(4n)::before{background:var(--mint)}
.deco{position:fixed;pointer-events:none;z-index:0}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .3s}
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--text);color:var(--white);padding:.45rem .9rem;font-size:.65rem;z-index:2000;animation:su .2s}
.toast.err{background:#c44;font-weight:500}
.foot{padding:1.2rem 0 .8rem;text-align:center;font-size:.5rem;color:var(--t3);letter-spacing:.08em}

@media(max-width:768px){
  html,body{overflow-x:hidden;width:100%}
  .app{padding:0 .7rem;max-width:100vw;overflow-x:hidden}
  .hd{padding:.5rem 0;flex-wrap:wrap;gap:.3rem}
  .logo{font-size:1rem}
  .logo-sub{font-size:.4rem;margin-left:.3rem}
  .nav-b{padding:.22rem .4rem;font-size:.52rem}
  .sync-badge{font-size:.4rem;padding:.06rem .2rem}
  .hero{padding:1rem 0 .6rem}
  .hero::after{display:none}
  .hero-motto{font-size:1.5rem}
  .hero-photo{width:110px;height:75px}
  .tl::before,.tl::after{display:none}
  .tw::before,.tw::after{display:none}
  .kpi::before,.kpi::after{display:none}
  .deco{display:none}
  .mg{grid-template-columns:1fr;gap:.8rem}
  .sb-inner{position:static}
  .side-photo{display:none}
  .tr{padding:.2rem .4rem;font-size:.7rem;gap:.2rem}
  .td-date{font-size:.48rem;min-width:24px}
  .tn{font-size:.66rem}
  .tt{display:none}
  .ttm{font-size:.56rem;min-width:20px}
  .ta{gap:1px}
  .bt{font-size:.44rem;padding:.08rem .22rem}
  .te{padding:.15rem .4rem;font-size:.48rem}
  .cg-head{padding:.18rem .4rem;font-size:.62rem}
  .cg-cnt{font-size:.48rem}
  .kpi-i{padding:.35rem .5rem}
  .kpi-v{font-size:.95rem}
  .kpi-l{font-size:.42rem}
  .rf{gap:.3rem}
  .rtbl td,.rtbl th{padding:.25rem .3rem;font-size:.58rem}
  .dg{grid-template-columns:1fr}
  .fr{grid-template-columns:1fr}
  .tw-d{font-size:1.3rem}
  .rule{height:2px}
  .btn-s{padding:.2rem .45rem;font-size:.58rem}
}

.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:1rem}
.auth-card{background:var(--white);width:100%;max-width:380px;padding:2rem;position:relative}
.auth-card::before{content:'';position:absolute;top:-8px;left:-8px;right:12px;bottom:12px;border:1.5px solid var(--fd);pointer-events:none}
.auth-card::after{content:'';position:absolute;top:6px;left:8px;right:-6px;bottom:-6px;border:1px solid var(--fm);pointer-events:none}
.auth-title{font-size:1.3rem;font-weight:900;margin-bottom:.15rem}
.auth-sub{font-size:.6rem;color:var(--t3);margin-bottom:1.5rem}
.auth-err{font-size:.65rem;color:#c77;margin-bottom:.5rem;padding:.3rem .5rem;background:rgba(204,119,119,.08);border:1px solid rgba(204,119,119,.15)}
.auth-sw{font-size:.6rem;color:var(--t3);margin-top:1rem;text-align:center}
.auth-sw a{color:var(--text);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sync-badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.48rem;color:var(--t3);padding:.1rem .35rem;background:rgba(199,240,219,.3);border-radius:2px}
.sync-badge.off{background:rgba(255,200,221,.3)}
.sync-badge.err{background:rgba(204,119,119,.15);color:#c77;font-weight:500}
.sync-badge .dot{width:5px;height:5px;border-radius:50%}
.sync-badge .dot.on{background:#5a8f6e}
.sync-badge .dot.off{background:#c77}
.sync-badge .dot.sav{background:#b58040}
</style>
</head>

function fmtDate(d){if(!d)return'';const t=new Date();t.setHours(0,0,0,0);const dt=new Date(d+'T00:00:00');const diff=Math.round((dt-t)/864e5);if(diff===0)return'今日';if(diff===1)return'明日';return(dt.getMonth()+1)+'/'+dt.getDate();}
function dateClass(d){if(!d)return'';const t=new Date();t.setHours(0,0,0,0);const dt=new Date(d+'T00:00:00');const diff=Math.round((dt-t)/864e5);if(diff===0)return'today';if(diff<0)return'overdue';return'';}
const localDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function nextDue(task){
  const today=new Date();today.setHours(0,0,0,0);
  if(task.repeat==='daily'){const n=new Date(today);n.setDate(n.getDate()+1);return localDate(n);}
  if(task.repeat==='weekly'&&task.repeatDays?.length){for(let i=1;i<=7;i++){const d=new Date(today);d.setDate(d.getDate()+i);if(task.repeatDays.includes(d.getDay()))return localDate(d);}const n=new Date(today);n.setDate(n.getDate()+7);return localDate(n);}
  if(task.repeat==='monthly'){const base=task.dueDate?new Date(task.dueDate+'T00:00:00'):today;const dayOfMonth=base.getDate();const n=new Date(today.getFullYear(),today.getMonth()+1,dayOfMonth);if(n<=today)n.setMonth(n.getMonth()+1);return localDate(n);}
  return task.dueDate;
}
function migrate(raw){
  const r={};
  if(raw.clients)r.clients=raw.clients.map(c=>({id:c.client_id||c.id||gid(),name:c.name||'',monthlyRevenue:c.monthly_fee??c.monthlyRevenue??0,monthlyHours:c.monthlyHours??20}));
  if(raw.tasks)r.tasks=raw.tasks.map(t=>{let rep='none';if(typeof t.repeat==='boolean')rep=t.repeat?(t.repeatType||'daily'):'none';else if(typeof t.repeat==='string')rep=t.repeat;return{id:t.task_id||t.id||gid(),name:t.title||t.name||'',clientId:t.client_id||t.clientId||'',dueDate:t.due_date||t.dueDate||null,dueTime:t.due_time||t.dueTime||null,category:t.category||'routine',repeat:rep,repeatDays:t.repeatDays||[],completed:t.completed||false,isActive:t.is_active??t.isActive??!t.completed,lastCompleted:t.last_completed||t.lastCompleted||null,notes:t.notes||'',createdAt:t.createdAt||new Date().toISOString()}});
  if(raw.timeLogs)r.timeLogs=raw.timeLogs.map(l=>({id:l.time_log_id||l.id||gid(),taskId:l.task_id||l.taskId||'',startTime:l.start_ts?new Date(l.start_ts).toISOString():(l.startTime||new Date().toISOString()),endTime:l.end_ts?new Date(l.end_ts).toISOString():(l.endTime||new Date().toISOString()),duration:l.duration_sec?Math.round(l.duration_sec/60):(l.duration||0)}));
  if(raw.principles){const p=raw.principles;r.principles={main:p.motto||p.main||'',sub:(p.subCopy||p.sub||'')+(p.principles?'\n'+p.principles:'')};}
  if(raw.clientOrder)r.clientOrder=raw.clientOrder;
  if(raw.runningState){const rs=raw.runningState;r.runningState=rs?.task_id?{taskId:rs.task_id,startTime:rs.start_ts?new Date(rs.start_ts).toISOString():null}:rs;}
  return r;
}

// ==================== DEDUP REPEAT TASKS ====================
// 同名・同クライアントのリピートタスクが複数アクティブな場合、最新dueDate以外を完了にする
function deduplicateRepeatTasks(tasks){
  const active=tasks.filter(t=>!t.completed&&t.repeat&&t.repeat!=='none');
  const groups={};
  active.forEach(t=>{
    const k=t.name+'|'+t.clientId;
    if(!groups[k])groups[k]=[];
    groups[k].push(t);
  });
  const toComplete=new Set();
  Object.values(groups).forEach(arr=>{
    if(arr.length<2)return;
    const sorted=[...arr].sort((a,b)=>{
      if(!a.dueDate)return 1;
      if(!b.dueDate)return -1;
      return b.dueDate.localeCompare(a.dueDate);
    });
    sorted.slice(1).forEach(t=>toComplete.add(t.id));
  });
  if(!toComplete.size)return tasks;
  const now=new Date().toISOString();
  const deduped=tasks.map(t=>toComplete.has(t.id)?{...t,completed:true,lastCompleted:now}:t);
  console.log('[DEDUP] Marked',toComplete.size,'duplicate repeat tasks as completed');
  return deduped;
}

// ==================== FIXED SUPABASE SYNC ====================
// FIX: Track cloud data count to prevent empty overwrites
let cloudTaskCount=0;
let cloudLogCount=0;
let saveTimer=null;
let _syncCb=null; // callback for sync status

async function loadFromSupabase(userId){
  if(!sb)return null;
  try{
    const{data,error}=await sb.from('user_data').select('*').eq('user_id',userId).single();
    if(error){
      if(error.code==='PGRST116'){await sb.from('user_data').insert({user_id:userId});return null;}
      console.error('Load error:',error);return null;
    }
    if(data?.tasks?.length)cloudTaskCount=data.tasks.length;
    if(data?.time_logs?.length)cloudLogCount=data.time_logs.length;
    return data;
  }catch(e){console.error('Load error:',e);return null;}
}

function saveToSupabase(userId,state){
  if(!sb||!userId)return;
  const taskLen=state.tasks?state.tasks.length:0;
  const logLen=state.timeLogs?state.timeLogs.length:0;
  if(cloudTaskCount>0&&taskLen===0){console.warn('[SYNC BLOCKED] empty tasks');return;}
  if(cloudTaskCount>10&&taskLen<Math.floor(cloudTaskCount*0.3)){console.warn('[SYNC BLOCKED] task drop');return;}
  if(cloudLogCount>0&&logLen===0){console.warn('[SYNC BLOCKED] empty logs');return;}
  clearTimeout(saveTimer);
  if(_syncCb)_syncCb('saving');
  saveTimer=setTimeout(async()=>{
    // Check auth session is still valid before saving
    try{
      const{data:{session}}=await sb.auth.getSession();
      if(!session){
        console.error('[SYNC] No active session');
        if(_syncCb)_syncCb('error');
        return;
      }
    }catch(e){console.error('[SYNC] Session check failed:',e);if(_syncCb)_syncCb('error');return;}
    // SAFE MERGE: fetch current cloud state and add any cloud-only items before saving
    // This prevents data loss when another device or external write added new items
    try{
      const{data:cloudData}=await sb.from('user_data').select('tasks,time_logs').eq('user_id',userId).single();
      if(cloudData){
        const localTaskIds=new Set((state.tasks||[]).map(t=>t.id));
        const localLogIds=new Set((state.timeLogs||[]).map(l=>l.id));
        const extraTasks=(cloudData.tasks||[]).filter(t=>!localTaskIds.has(t.id));
        const extraLogs=(cloudData.time_logs||[]).filter(l=>!localLogIds.has(l.id));
        if(extraTasks.length||extraLogs.length){
          state={...state,
            tasks:[...state.tasks,...extraTasks],
            timeLogs:[...state.timeLogs,...extraLogs]
          };
          console.log('[SYNC] Merged cloud extras:',extraTasks.length,'tasks,',extraLogs.length,'logs');
        }
      }
    }catch(e){console.warn('[SYNC] Pre-save merge failed (non-fatal):',e);}
    // Save with retry (up to 2 attempts)
    for(let attempt=0;attempt<2;attempt++){
      try{
        const{error}=await sb.from('user_data').upsert({
          user_id:userId,clients:state.clients,tasks:state.tasks,
          time_logs:state.timeLogs,principles:state.principles,
          client_order:state.clientOrder,running_state:state.running
        });
        if(error){
          console.error('[SYNC] Save error (attempt '+(attempt+1)+'):',error);
          if(attempt===1){if(_syncCb)_syncCb('error');}
          else{await new Promise(r=>setTimeout(r,2000));}
          continue;
        }
        if(state.tasks)cloudTaskCount=state.tasks.length;
        if(state.timeLogs)cloudLogCount=state.timeLogs.length;
        if(_syncCb)_syncCb('ok');
        return;
      }catch(e){
        console.error('[SYNC] Save exception (attempt '+(attempt+1)+'):',e);
        if(attempt===1){if(_syncCb)_syncCb('error');}
        else{await new Promise(r=>setTimeout(r,2000));}
      }
    }
  },800);
}

function Root(){
  const[user,setUser]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[synced,setSynced]=useState(false);
  useEffect(()=>{
    if(!sb){setAuthLoading(false);return;}
    sb.auth.getSession().then(({data:{session}})=>{setUser(session?.user||null);setAuthLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{setUser(session?.user||null);});
    return()=>subscription?.unsubscribe();
  },[]);
  if(!sbEnabled)return <App userId={null} synced={false}/>;
  if(authLoading)return <div className="auth-bg"><div style={{color:'var(--t3)',fontSize:'.7rem'}}>読み込み中...</div></div>;
  if(!user)return <AuthScreen onAuth={u=>setUser(u)}/>;
  return <App userId={user.id} synced={synced} setSynced={setSynced} userEmail={user.email} onLogout={async()=>{await sb.auth.signOut();setUser(null)}}/>;
}

function App({userId,synced,setSynced,userEmail,onLogout}){
  const[tab,setTab]=useState('dashboard');
  const[clients,setCl]=useState(()=>ld('timevalue-clients',[]));
  const[tasks,setTk]=useState(()=>ld('timevalue-tasks',[]));
  const[timeLogs,setTl]=useState(()=>ld('timevalue-timeLogs',[]));
  const[principles,setPr]=useState(()=>ld('timevalue-principles',{main:'独責開眼',sub:'責任を負うと見える世界が変わる'}));
  const[clientOrder,setCo]=useState(()=>ld('timevalue-clientOrder',[]));
  const[running,setRn]=useState(()=>ld('timevalue-runningState',null));
  const[toast,setToast]=useState(null);
  const[pi]=useState(()=>Math.floor(Math.random()*PHOTOS.length));
  const[si]=useState(()=>Math.floor(Math.random()*SIDE.length));
  const[cloudLoaded,setCloudLoaded]=useState(false);
  const[syncStatus,setSyncStatus]=useState('loading'); // 'loading'|'ok'|'saving'|'error'
  const cloudJustLoaded=useRef(false);

  // Register sync status callback
  useEffect(()=>{_syncCb=setSyncStatus;return()=>{_syncCb=null}},[]);

  // Periodic session check (every 5 min)
  useEffect(()=>{
    if(!sb||!userId)return;
    const iv=setInterval(async()=>{
      try{
        const{data:{session}}=await sb.auth.getSession();
        if(!session){setSyncStatus('error');}
      }catch{setSyncStatus('error');}
    },300000);
    return()=>clearInterval(iv);
  },[userId]);

  // FIX: Load from Supabase - merge cloud+local to prevent data loss when cloud is stale
  useEffect(()=>{
    if(!userId)return;
    (async()=>{
      const data=await loadFromSupabase(userId);
      const localTasks=ld('timevalue-tasks',[]);
      const localClients=ld('timevalue-clients',[]);
      const localTimeLogs=ld('timevalue-timeLogs',[]);
      const hasCloud=!!(data&&(data.tasks?.length>0||data.clients?.length>0||data.time_logs?.length>0));
      const hasLocal=localTasks.length>0||localClients.length>0;
      if(data!==null&&(hasCloud||hasLocal)){
        // Merge cloud+local by ID: cloud wins for conflicts, local-only items are preserved
        const cloudTaskIds=new Set((data.tasks||[]).map(t=>t.id));
        const cloudClientIds=new Set((data.clients||[]).map(c=>c.id));
        const cloudLogIds=new Set((data.time_logs||[]).map(l=>l.id));
        const mergedTasks=deduplicateRepeatTasks([...(data.tasks||[]),...localTasks.filter(t=>!cloudTaskIds.has(t.id))]);
        const mergedClients=[...(data.clients||[]),...localClients.filter(c=>!cloudClientIds.has(c.id))];
        const mergedTimeLogs=[...(data.time_logs||[]),...localTimeLogs.filter(l=>!cloudLogIds.has(l.id))];
        const hasLocalExtra=mergedTasks.length>(data.tasks?.length||0)||mergedClients.length>(data.clients?.length||0)||mergedTimeLogs.length>(data.time_logs?.length||0);
        setCl(mergedClients);
        setTk(mergedTasks);
        setTl(mergedTimeLogs);
        if(data.principles&&data.principles.main)setPr(data.principles);
        if(data.client_order)setCo(data.client_order);
        if(data.running_state!==undefined)setRn(data.running_state);
        if(!hasLocalExtra)cloudJustLoaded.current=true; // cloud was up-to-date, skip redundant save
        console.log('[SYNC]',hasLocalExtra?'Merged local+cloud (local had newer items)':'Loaded cloud data');
      }
      setCloudLoaded(true);
      setSyncStatus('ok');
      if(setSynced)setSynced(true);
    })();
  },[userId]);

  useEffect(()=>sv('timevalue-clients',clients),[clients]);
  useEffect(()=>sv('timevalue-tasks',tasks),[tasks]);
  useEffect(()=>sv('timevalue-timeLogs',timeLogs),[timeLogs]);
  useEffect(()=>sv('timevalue-principles',principles),[principles]);
  useEffect(()=>sv('timevalue-clientOrder',clientOrder),[clientOrder]);
  useEffect(()=>sv('timevalue-runningState',running),[running]);

  // FIX: Only save to cloud AFTER cloud data is loaded, and skip if we just loaded (no changes)
  useEffect(()=>{
    if(!cloudLoaded||!userId)return;
    if(cloudJustLoaded.current){cloudJustLoaded.current=false;return;}
    saveToSupabase(userId,{clients,tasks,timeLogs,principles,clientOrder,running});
  },[clients,tasks,timeLogs,principles,clientOrder,running,cloudLoaded,userId]);

  const show=useCallback(m=>{setToast(m);setTimeout(()=>setToast(null),2200)},[]);
  // Alert user when sync fails
  useEffect(()=>{
    if(syncStatus==='error'){setToast('同期失敗 — データが保存されていません');setTimeout(()=>setToast(null),5000);}
  },[syncStatus]);
  const gcn=useCallback(cid=>{const c=clients.find(x=>x.id===cid);return c?c.name:'未分類'},[clients]);
  const oc=useMemo(()=>{if(!clientOrder.length)return clients;const o=[];clientOrder.forEach(id=>{const c=clients.find(x=>x.id===id);if(c)o.push(c)});clients.forEach(c=>{if(!o.find(x=>x.id===c.id))o.push(c)});return o},[clients,clientOrder]);
  const gtt=useCallback(tid=>timeLogs.filter(l=>l.taskId===tid).reduce((a,l)=>a+(l.duration||0),0),[timeLogs]);
  const startT=useCallback(tid=>{if(running){show('他のタイマーが実行中');return}setRn({taskId:tid,startTime:new Date().toISOString()});show('開始')},[running,show]);
  const stopT=useCallback(()=>{if(!running)return;const endTime=new Date().toISOString();const dur=Math.round((new Date(endTime)-new Date(running.startTime))/60000);if(dur>0)setTl(p=>[...p,{id:gid(),taskId:running.taskId,startTime:running.startTime,endTime,duration:dur}]);setRn(null);show('停止')},[running,show]);

  const tabs=[{id:'dashboard',l:'Dashboard'},{id:'clients',l:'Clients'},{id:'report',l:'Report'}];
  return(
    <div className="app">
      <header className="hd">
        <div style={{display:'flex',alignItems:'baseline',gap:'.4rem'}}>
          <div className="logo">TimeValue</div><span className="logo-sub">Tracker</span>
          {sbEnabled&&<span className={'sync-badge'+(syncStatus==='error'?' err':syncStatus==='ok'?' ':' off')} onClick={syncStatus==='error'?()=>{saveToSupabase(userId,{clients,tasks,timeLogs,principles,clientOrder,running});show('再同期中...')}:undefined} style={syncStatus==='error'?{cursor:'pointer'}:{}}><span className={'dot'+(syncStatus==='ok'?' on':syncStatus==='saving'?' sav':' off')}></span>{syncStatus==='ok'?'同期済':syncStatus==='saving'?'保存中':syncStatus==='error'?'同期失敗（タップで再試行）':'接続中'}</span>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
          <nav className="nav">{tabs.map(t=><button key={t.id} className={'nav-b'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>{t.l}</button>)}</nav>
          {onLogout&&<button className="bt" style={{fontSize:'.48rem',padding:'.1rem .3rem'}} onClick={onLogout} title={userEmail}>ログアウト</button>}
        </div>
      </header>
      {tab==='dashboard'&&<Dash pr={principles} setPr={setPr} tasks={tasks} setTk={setTk} clients={clients} oc={oc} clientOrder={clientOrder} timeLogs={timeLogs} setTl={setTl} running={running} setRn={setRn} startT={startT} stopT={stopT} gcn={gcn} gtt={gtt} show={show} pi={pi} si={si}/>}
      {tab==='clients'&&<Clients clients={clients} setCl={setCl} oc={oc} co={clientOrder} setCo={setCo} tasks={tasks} timeLogs={timeLogs} show={show}/>}
      {tab==='report'&&<ReportPage tasks={tasks} clients={clients} setCl={setCl} timeLogs={timeLogs} setTl={setTl} gcn={gcn} setTk={setTk} pr={principles} setPr={setPr} co={clientOrder} setCo={setCo} running={running} setRn={setRn} show={show}/>}
      <div className="foot">TimeValue Tracker v17</div>
      {toast&&<div className={'toast'+(toast.includes('同期失敗')?' err':'')}>{toast}</div>}
    </div>
  );
}

function Dash({pr,setPr,tasks,setTk,clients,oc,clientOrder,timeLogs,setTl,running,setRn,startT,stopT,gcn,gtt,show,pi,si}){
  const[eP,setEP]=useState(false);const[pF,setPF]=useState(pr);
  const[modal,setMo]=useState(false);const[et,setEt]=useState(null);
  const[filter,setFi]=useState('active');const[exp,setExp]=useState(null);
  const[editTime,setEditTime]=useState(null);const[etH,setEtH]=useState(0);const[etM,setEtM]=useState(0);

  const ft=useMemo(()=>{
    let list;
    if(filter==='active')list=tasks.filter(t=>!t.completed);
    else if(filter==='completed')list=tasks.filter(t=>t.completed);
    else list=[...tasks];
    return list.sort((a,b)=>{const da=a.dueDate||'9999';const db=b.dueDate||'9999';if(da!==db)return da.localeCompare(db);return(a.dueTime||'99:99').localeCompare(b.dueTime||'99:99')});
  },[tasks,filter]);

  const grouped=useMemo(()=>{
    const groups=[];const order=clientOrder.length?clientOrder:clients.map(c=>c.id);
    const cids=[...new Set(ft.map(t=>t.clientId))];const sorted=[];order.forEach(id=>{if(cids.includes(id))sorted.push(id)});cids.forEach(id=>{if(!sorted.includes(id))sorted.push(id)});
    sorted.forEach(cid=>{const cTasks=ft.filter(t=>t.clientId===cid);if(cTasks.length)groups.push({clientId:cid,clientName:gcn(cid),tasks:cTasks})});
    return groups;
  },[ft,clientOrder,clients,gcn]);

  const saveP=()=>{setPr(pF);setEP(false);show('更新')};
  const saveTask=d=>{if(et){setTk(p=>p.map(t=>t.id===et.id?{...t,...d}:t));show('更新')}else{setTk(p=>[...p,{id:gid(),...d,completed:false,createdAt:new Date().toISOString()}]);show('作成')}setMo(false);setEt(null)};
  const del=id=>{if(confirm('削除？')){setTk(p=>p.filter(t=>t.id!==id));show('削除')}};
  const comp=id=>{
    const task=tasks.find(t=>t.id===id);if(!task)return;
    // Bug1 fix: build newTimeLogs locally to avoid stale state in upsert
    let newTimeLogs=timeLogs;
    if(running&&running.taskId===id){
      const endTime=new Date().toISOString();
      const dur=Math.round((new Date(endTime)-new Date(running.startTime))/60000);
      if(dur>0)newTimeLogs=[...timeLogs,{id:gid(),taskId:id,startTime:running.startTime,endTime,duration:dur}];
      setTl(newTimeLogs);
      setRn(null);
    }
    setTk(p=>{
      let updated=p.map(t=>t.id===id?{...t,completed:true,lastCompleted:new Date().toISOString()}:t);
      if(task.repeat&&task.repeat!=='none'){
        const nd=nextDue(task);
        updated=[...updated,{...task,id:gid(),dueDate:nd,completed:false,isActive:true,createdAt:new Date().toISOString()}];
        show('完了 → 次回 '+fmtDate(nd));
      }else{show('完了');}
      return updated;
    });
  };
  const uncomp=id=>{setTk(p=>p.map(t=>t.id===id?{...t,completed:false,lastCompleted:null}:t));show('未完了に戻し')};

function ReportPage({tasks,clients,setCl,timeLogs,setTl,gcn,setTk,pr,setPr,co,setCo,running,setRn,show}){
  const[per,setPer]=useState('month');const[cf,setCf]=useState('all');const[sf,setSf]=useState('completed');const[msgs,setMs]=useState([]);const[cin,setCin]=useState('');const[cld,setCld]=useState(false);const fRef=useRef(null);
  const[cFrom,setCFrom]=useState('');const[cTo,setCTo]=useState('');

  const fl=useMemo(()=>{let l=[...timeLogs];const r=getRange(per);if(r){l=l.filter(x=>{const d=new Date(x.startTime);return d>=r.s&&d<=r.e})}if(cf!=='all')l=l.filter(x=>{const t=tasks.find(tt=>tt.id===x.taskId);return t&&t.clientId===cf});return l},[timeLogs,tasks,per,cf,cFrom,cTo]);
  const ts=useMemo(()=>{const m={};fl.forEach(l=>{const t=tasks.find(x=>x.id===l.taskId);if(!t)return;if(sf==='completed'&&!t.completed)return;if(sf==='active'&&t.completed)return;if(!m[t.id])m[t.id]={id:t.id,name:t.name,cn:gcn(t.clientId),cat:t.category,tm:0,due:t.dueDate,done:t.completed};m[t.id].tm+=l.duration||0});return Object.values(m).sort((a,b)=>(b.due||'').localeCompare(a.due||''))},[fl,tasks,gcn,sf]);
  const send=async()=>{if(!cin.trim()||cld)return;const um=cin.trim();setCin('');setMs(p=>[...p,{role:'user',content:um}]);setCld(true);const ctx=`作業レポート:\n- 総時間:${fT(kpi.tm)}\n${ts.map(t=>'- '+t.name+'('+t.cn+'):'+fT(t.tm)).join('\n')}`;try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,system:'ワークコーチとして日本語で内省を促してください。\n'+ctx,messages:msgs.concat([{role:'user',content:um}]).map(m=>({role:m.role,content:m.content}))})});const d=await r.json();setMs(p=>[...p,{role:'assistant',content:d.content?.map(c=>c.text||'').join('')||'エラー'}])}catch{setMs(p=>[...p,{role:'assistant',content:'接続エラー'}])}setCld(false)};
  const expData=()=>{const d={clients,tasks,timeLogs,principles:pr,clientOrder:co,runningState:running,exportDate:new Date().toISOString(),version:'v17'};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='timevalue-backup-'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(u);show('エクスポート完了')};
  const impData=e=>{const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const raw=JSON.parse(ev.target.result);const d=migrate(raw);if(d.clients)setCl(d.clients);if(d.tasks)setTk(d.tasks);if(d.timeLogs)setTl(d.timeLogs);if(d.principles)setPr(d.principles);if(d.clientOrder)setCo(d.clientOrder);if(d.runningState!==undefined)setRn(d.runningState);show('インポート完了')}catch(err){console.error(err);show('失敗')}};r.readAsText(file);if(fRef.current)fRef.current.value=''};
  const genReport=async()=>{
    const cn=cf==='all'?'全取引先':(clients.find(x=>x.id===cf)?.name||'');
    const mrev=cf==='all'?clients.reduce((a,c)=>a+(c.monthlyRevenue||0),0):(clients.find(x=>x.id===cf)?.monthlyRevenue||0);
    const mm={};fl.forEach(l=>{const d=new Date(l.startTime);const k=d.getFullYear()+'年'+(d.getMonth()+1)+'月';mm[k]=(mm[k]||0)+(l.duration||0);});
    const mos=Object.entries(mm).sort((a,b)=>a[0].localeCompare(b[0]));
    const monthTaskMap={};fl.forEach(l=>{const d=new Date(l.startTime);const k=d.getFullYear()+'年'+(d.getMonth()+1)+'月';const t=tasks.find(x=>x.id===l.taskId);if(!t)return;const tk=k+'||'+t.name+'||'+gcn(t.clientId);if(!monthTaskMap[tk])monthTaskMap[tk]={month:k,name:t.name,cn:gcn(t.clientId),tm:0};monthTaskMap[tk].tm+=l.duration||0;});const mosTasks={};Object.values(monthTaskMap).forEach(e=>{if(!mosTasks[e.month])mosTasks[e.month]=[];mosTasks[e.month].push(e);});Object.keys(mosTasks).forEach(k=>{mosTasks[k].sort((a,b)=>b.tm-a.tm);});
    const fm=m=>{const h=Math.floor(m/60);const n=m%60;return n>0?`${h}h ${String(n).padStart(2,'0')}m`:`${h}h`;};
    const pc=m=>kpi.tm>0?((m/kpi.tm)*100).toFixed(1):'0.0';
    const today=new Date().toISOString().split('T')[0];

    const todayD=new Date();const currentMonthKey=todayD.getFullYear()+'年'+(todayD.getMonth()+1)+'月';const daysInCurMo=new Date(todayD.getFullYear(),todayD.getMonth()+1,0).getDate();const curDayFrac=todayD.getDate()/daysInCurMo;const fullMosCnt=mos.filter(([k])=>k!==currentMonthKey).length;const hasCurMo=mos.some(([k])=>k===currentMonthKey);const totalMosCnt=fullMosCnt+(hasCurMo?curDayFrac:0);const totalRev=totalMosCnt>0&&mrev>0?Math.round(mrev*totalMosCnt):mrev;const hr=kpi.tm>0&&totalRev>0?Math.round(totalRev/(kpi.tm/60)):0;

    // --- タスク集計: 同名+同取引先はまとめる ---

    const catLabel={routine:'定期タスク',strategic:'Strategic',creative:'Creative',admin:'定期タスク以外'};
    const grps={};aggTasks.forEach(t=>{const c=t.cat||'admin';if(!grps[c])grps[c]=[];grps[c].push(t);});
    const taskHtml=Object.entries(grps).map(([cat,rows])=>{const gt=rows.reduce((a,r)=>a+r.tm,0);const rh=rows.map(t=>{const bw=Math.round((t.tm/mxt)*100);return `<div class="task-row"><div><div class="task-name">${t.name}</div><div style="margin-top:.2rem"><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${bw}%"></div></div></div></div></div><span class="task-cat">${t.cn}</span><span class="task-pct">${pc(t.tm)}%</span><span class="task-time">${fm(t.tm)}</span></div>`;}).join('');return `<div class="group-header">${catLabel[cat]||cat}<span class="group-sub">合計 ${fm(gt)}</span></div>${rh}`;}).join('');
    // --- Section 04: 一緒に確認したいこと ---
    const top1=aggTasks[0];
    const top2=aggTasks[1];
    const maxMos=mos.reduce((a,b)=>b[1]>a[1]?b:a,['',0]);
    const overMos=mos.filter(([,v])=>v>c20);
    const totalOver=mos.reduce((a,[,v])=>a+(v>c20?v-c20:0),0);
    const pts=[];
    if(top1)pts.push({num:'01',title:`「${top1.name}」が全体の${pc(top1.tm)}%を占めています`,desc:`${top1.cn}の「${top1.name}」が最も稼働時間が多いタスクです。このタスクの進捗や優先度について確認しましょう。`,data:`累計 ${fm(top1.tm)}（全体の${pc(top1.tm)}%）`});
    if(maxMos[0])pts.push({num:'02',title:`${maxMos[0]}の稼働が最も多く${fm(maxMos[1])}でした`,desc:`${maxMos[0]}は対象期間の中で最も稼働時間が集中した月です。${maxMos[1]>c20?'契約上限を超えています。':''}この月に何が重なったか振り返りましょう。`,data:`${maxMos[0]}: ${fm(maxMos[1])}${maxMos[1]>c20?' (超過: +'+fm(maxMos[1]-c20)+')':' (範囲内)'}`});
    if(overMos.length>0)pts.push({num:'03',title:`${overMos.length}ヶ月で契約上限を超えています`,desc:`対象期間中、${overMos.map(([k])=>k).join('・')}の計${overMos.length}ヶ月で月20hを超過しています。超過分の取り扱いについて確認しましょう。`,data:`超過合計: ${fm(totalOver)}（${overMos.length}ヶ月分）`});
    else pts.push({num:'03',title:'すべての月で契約時間内に収まっています',desc:'対象期間中、いずれの月も月20hの契約上限を超えていません。このペースを維持できているか確認しましょう。',data:`総稼働: ${fm(kpi.tm)} / 全月平均: ${mos.length>0?fm(Math.round(kpi.tm/mos.length)):'—'}`});
    if(top2)pts.push({num:'04',title:`「${top2.name}」も${pc(top2.tm)}%を占めています`,desc:`${top2.cn}の「${top2.name}」は2番目に稼働時間が多いタスクです。今後の方針や継続的な対応が必要かどうか確認しましょう。`,data:`累計 ${fm(top2.tm)}（全体の${pc(top2.tm)}%）`});
    else pts.push({num:'04',title:'稼働内訳をご確認ください',desc:'タスク別の内訳を確認し、今後のスケジュール調整や優先度の見直しについて話し合いましょう。',data:`総稼働タスク数: ${aggTasks.length}件`});
    const sec04Html=`<ul class="points-list">${pts.map(p=>`<li class="point-item"><div class="point-num">${p.num}</div><div class="point-body"><div class="point-title">${p.title}</div><div class="point-desc">${p.desc}</div><div class="point-data">${p.data}</div></div></li>`).join('')}</ul>`;
    const secN=mos.length>1;
    const sIdx=secN?['01','02','03','04']:['01','02','03'];
    const monthTasksHtml=mos.map(([k,v])=>{const rows=mosTasks[k]||[];if(!rows.length)return'';const isCurMo=k===currentMonthKey;return`<details class="month-task-block"${mos.length===1?' open':''}><summary class="month-task-hdr"><span>${k}${isCurMo?' <span style="font-size:.6rem;color:var(--warn);font-weight:600">(進行中)</span>':''}</span><span class="month-task-meta">${fm(v)} / ${rows.length}タスク <span style="font-size:.65rem;opacity:.5">▼</span></span></summary><div class="task-list">${rows.map(t=>{const bw=Math.round((t.tm/mxt)*100);return`<div class="task-row"><div><div class="task-name">${t.name}</div><div style="margin-top:.2rem"><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${bw}%"></div></div></div></div></div><span class="task-cat">${t.cn}</span><span class="task-pct">${pc(t.tm)}%</span><span class="task-time">${fm(t.tm)}</span></div>`;}).join('')}</div></details>`;}).join('');
    const css=`*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root{--bg:#f7f6f4;--white:#fff;--text:#1a1a1a;--t2:#555;--t3:#999;--bdr:#e0dcd6;--over:#c0392b;--over-light:#fdecea;--ok:#27ae60;--ok-light:#eafaf1;--warn:#e67e22;--warn-light:#fef5ec;--bar-bg:#e8e4df;--bar-fill:#2a2a2a}body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}.page{max-width:900px;margin:0 auto;padding:3rem 2rem 6rem}.report-header{border-bottom:3px solid var(--text);padding-bottom:1.5rem;margin-bottom:2.5rem}.report-label{font-size:.7rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--t3);margin-bottom:.4rem}.report-title{font-size:2rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}.report-meta{margin-top:.8rem;font-size:.8rem;color:var(--t2);display:flex;gap:2rem;flex-wrap:wrap}.report-meta span strong{color:var(--text);font-weight:600}.section{margin-bottom:3rem}.section-title{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);border-top:1px solid var(--bdr);padding-top:.6rem;margin-bottom:1.2rem}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}.card{background:var(--white);border:1px solid var(--bdr);padding:1.2rem 1.4rem}.card.over{border-left:4px solid var(--over)}.card.ok{border-left:4px solid var(--ok)}.card-label{font-size:.7rem;color:var(--t3);font-weight:500;margin-bottom:.3rem}.card-value{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1}.card-sub{font-size:.72rem;color:var(--t2);margin-top:.3rem}.monthly-table{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:1rem}.monthly-table th{text-align:left;font-size:.65rem;font-weight:600;letter-spacing:.08em;color:var(--t3);padding:.5rem .8rem;border-bottom:1px solid var(--bdr)}.monthly-table td{padding:.75rem .8rem;border-bottom:1px solid var(--bdr);vertical-align:middle}.monthly-table tr:last-child td{border-bottom:none}.month-label{font-weight:600}.status-badge{display:inline-block;font-size:.68rem;font-weight:600;padding:.2rem .5rem;border-radius:2px}.status-badge.over{background:var(--over-light);color:var(--over)}.status-badge.ok{background:var(--ok-light);color:var(--ok)}.status-badge.warn{background:var(--warn-light);color:var(--warn)}.bar-wrap{display:flex;align-items:center;gap:.6rem}.bar-track{flex:1;height:8px;background:var(--bar-bg);border-radius:2px;overflow:hidden}.bar-fill{height:100%;border-radius:2px;background:var(--bar-fill)}.bar-fill.over{background:var(--over)}.bar-fill.ok{background:var(--ok)}.contract-line{font-size:.7rem;color:var(--t3);white-space:nowrap;min-width:3rem}.task-list{background:var(--white);border:1px solid var(--bdr)}.task-row{display:grid;grid-template-columns:1fr 110px 5rem 5.5rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--bdr);gap:.5rem;font-size:.85rem}.task-row:last-child{border-bottom:none}.task-row.header{background:#f2f0ed;font-size:.65rem;font-weight:700;letter-spacing:.06em;color:var(--t3);padding:.5rem 1rem}.task-name{font-weight:500;word-break:break-all}.task-cat{font-size:.7rem;color:var(--t2)}.task-pct{font-size:.78rem;color:var(--t2);text-align:right}.task-time{font-weight:700;text-align:right}.group-header{background:var(--text);color:var(--white);font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:.45rem 1rem}.group-sub{font-weight:400;opacity:.6;margin-left:.5rem}.points-list{list-style:none;display:flex;flex-direction:column;gap:.8rem}.point-item{background:var(--white);border:1px solid var(--bdr);padding:1rem 1.2rem;display:flex;gap:1rem;align-items:flex-start}.point-num{font-size:1.1rem;font-weight:800;color:var(--bdr);line-height:1;min-width:1.5rem}.point-body{flex:1;min-width:0}.point-title{font-weight:700;font-size:.9rem;margin-bottom:.3rem}.point-desc{font-size:.82rem;color:var(--t2);line-height:1.6}.point-data{font-size:.78rem;font-weight:600;color:var(--text);margin-top:.3rem}.month-tasks{margin-top:1.5rem;display:flex;flex-direction:column;gap:1.2rem}.month-task-block{}.month-task-block>summary{cursor:pointer;list-style:none;user-select:none}.month-task-block>summary::-webkit-details-marker{display:none}.month-task-hdr{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--text);padding:.5rem .8rem;background:var(--bg);border:1px solid var(--bdr);border-bottom:none;display:flex;justify-content:space-between;align-items:center}.month-task-hdr:hover{background:#eeecea}.month-task-block[open]>.month-task-hdr{border-bottom:none}.month-task-meta{font-weight:400;color:var(--t3);font-size:.68rem}.footer{margin-top:4rem;padding-top:1rem;border-top:1px solid var(--bdr);font-size:.72rem;color:var(--t3)}@media(max-width:600px){.page{padding:1.5rem 1rem 4rem}.report-title{font-size:1.4rem}.task-row{grid-template-columns:1fr 4rem}.task-row .task-cat,.task-row .task-pct{display:none}.summary-grid{grid-template-columns:1fr 1fr}}`;
    const html=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>稼働レポート — ${cn}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>${css}</style></head><body><div class="page"><header class="report-header"><div class="report-label">Working Hours Report</div><h1 class="report-title">稼働時間レポート<br>${cn}</h1><div class="report-meta"><span><strong>対象期間</strong> ${perLabel}</span>${mrev>0?`<span><strong>月額契約</strong> ${mrev.toLocaleString()}円</span>`:''}<span><strong>作成日</strong> ${today}</span></div></header><section class="section"><div class="section-title">${sIdx[0]} — 全体サマリー</div><div class="summary-grid"><div class="card over"><div class="card-label">累計稼働時間</div><div class="card-value">${fm(kpi.tm)}</div><div class="card-sub">${perLabel}</div></div>${mrev>0?`<div class="card"><div class="card-label">月額報酬</div><div class="card-value" style="font-size:1.5rem">${mrev.toLocaleString()}<span style="font-size:.9rem;font-weight:500">円</span></div><div class="card-sub">累計 ${totalRev.toLocaleString()}円（${Math.round(totalMosCnt*10)/10}ヶ月分）</div></div>`:''}${hr>0?`<div class="card ${hr<1500?'over':'ok'}"><div class="card-label">実質時給換算</div><div class="card-value" style="font-size:1.5rem">${hr.toLocaleString()}<span style="font-size:.9rem;font-weight:500">円</span></div><div class="card-sub">${totalRev.toLocaleString()}円 ÷ ${fm(kpi.tm)}</div></div>`:''}</div></section>${secN?`<section class="section"><div class="section-title">${sIdx[1]} — 月別の稼働時間</div><table class="monthly-table"><thead><tr><th>月</th><th>稼働時間</th><th>契約上限</th><th>差分</th><th style="width:220px">グラフ（20h基準）</th><th>状況</th></tr></thead><tbody>${mosHtml}</tbody></table><div class="month-tasks">${monthTasksHtml}</div></section>`:''}<section class="section"><div class="section-title">${secN?sIdx[2]:sIdx[1]} — タスク別の稼働時間</div><div class="task-list"><div class="task-row header"><span>タスク名</span><span>取引先</span><span style="text-align:right">占有率</span><span style="text-align:right">合計時間</span></div>${taskHtml}</div></section><section class="section"><div class="section-title">${secN?sIdx[3]:sIdx[2]} — 一緒に確認したいこと</div>${sec04Html}</section><footer class="footer"><p>本レポートは TimeValue Tracker から出力されたタイムログをもとに作成しています。</p><p style="margin-top:.3rem">対象期間：${perLabel} / 作成日：${today}</p></footer></div></body></html>`;
    show('レポートを保存中...');
    try{
      const res=await fetch('https://qxsxfrphdtxxhxmhfhio.supabase.co/rest/v1/reports',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({html})});
      const data=await res.json();
      const id=data?.[0]?.id;
      if(!id)throw new Error('IDが取得できませんでした');
      const url='https://timevalue-tracker.vercel.app/report.html?id='+id;
      window.open(url,'_blank');
      try{await navigator.clipboard.writeText(url);}catch(e){}
      show('公開リンクをコピーしました');
    }catch(e){show('エラー: '+e.message);}
  };
  return(<div className="fi" style={{padding:'1.5rem 0'}}>
    <div className="sh"><h2 className="st">Report</h2></div>
    <div className="rf"><div className="fg" style={{marginBottom:0}}><label className="fl">期間</label><select className="sel" style={{width:'auto',fontSize:'.65rem'}} value={per} onChange={e=>setPer(e.target.value)}><option value="today">今日</option><option value="yesterday">昨日</option><option value="week">1週間</option><option value="month">今月</option><option value="custom">期間指定</option><option value="all">全期間</option></select></div>{per==='custom'&&<><div className="fg" style={{marginBottom:0}}><label className="fl">開始日</label><input className="inp" type="date" style={{width:'auto',fontSize:'.65rem',padding:'.12rem .3rem'}} value={cFrom} onChange={e=>setCFrom(e.target.value)}/></div><div className="fg" style={{marginBottom:0}}><label className="fl">終了日</label><input className="inp" type="date" style={{width:'auto',fontSize:'.65rem',padding:'.12rem .3rem'}} value={cTo} onChange={e=>setCTo(e.target.value)}/></div></>}<div className="fg" style={{marginBottom:0}}><label className="fl">取引先</label><select className="sel" style={{width:'auto',fontSize:'.65rem'}} value={cf} onChange={e=>setCf(e.target.value)}><option value="all">すべて</option>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div><div className="fg" style={{marginBottom:0}}><label className="fl">ステータス</label><select className="sel" style={{width:'auto',fontSize:'.65rem'}} value={sf} onChange={e=>setSf(e.target.value)}><option value="completed">完了済み</option><option value="active">進行中</option><option value="all">すべて</option></select></div></div>
    <div className="kpi"><div className="kpi-i"><div className="kpi-l">Work</div><div className="kpi-v">{fT(kpi.tm)}</div></div><div className="kpi-i"><div className="kpi-l">Revenue</div><div className="kpi-v">{fY(kpi.tr)}</div></div><div className="kpi-i"><div className="kpi-l">Rate</div><div className="kpi-v">{fY(Math.round(kpi.hr))}<span className="kpi-u">/h</span></div></div></div>
    <div style={{marginBottom:'1.2rem'}}>{ts.length>0?<div style={{background:'var(--white)',border:'1px solid var(--bdr2)',padding:'.4rem'}}><table className="rtbl"><thead><tr><th>タスク</th><th>取引先</th><th>期日</th><th>Cat</th><th style={{textAlign:'right'}}>時間</th></tr></thead><tbody>{ts.map(t=>{const cat=CATS.find(c=>c.id===t.cat);return(<tr key={t.id}><td style={{fontWeight:400}}>{t.name}</td><td style={{fontSize:'.6rem',color:'var(--t3)'}}>{t.cn}</td><td style={{fontSize:'.6rem',color:'var(--t3)'}}>{t.due?fmtDate(t.due):'-'}</td><td>{cat&&<span className={'tt '+cat.c}>{cat.l}</span>}</td><td style={{textAlign:'right',fontWeight:600}}>{fT(t.tm)}</td></tr>)})}</tbody></table></div>:<div style={{textAlign:'center',color:'var(--t3)',padding:'1.2rem',background:'var(--white)',border:'1px solid var(--bdr2)'}}>データなし</div>}</div>
    <div className="cb" style={{marginBottom:'1.2rem'}}><div className="tw-l">AI Reflection</div><div className="cm">{msgs.length===0&&<div style={{textAlign:'center',color:'var(--t3)',fontSize:'.65rem',padding:'.8rem 0'}}>質問しましょう</div>}{msgs.map((m,i)=><div key={i} className={'cmb '+(m.role==='user'?'cmb-u':'cmb-a')}>{m.content}</div>)}{cld&&<div className="cmb cmb-a" style={{opacity:.5}}>...</div>}</div><div className="cr"><input className="inp" placeholder="質問..." value={cin} onChange={e=>setCin(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/><button className="btn btn-p btn-s" onClick={send} disabled={cld}>送信</button></div></div>
    <div className="dg"><div className="dc"><div style={{fontWeight:700,marginBottom:'.2rem',fontSize:'.8rem'}}>HTMLレポート</div><button className="btn btn-p btn-s" style={{marginTop:'.3rem'}} onClick={genReport}>レポート発行</button></div><div className="dc"><div style={{fontWeight:700,marginBottom:'.2rem',fontSize:'.8rem'}}>Export</div><button className="btn btn-p btn-s" style={{marginTop:'.3rem'}} onClick={expData}>エクスポート</button></div><div className="dc"><div style={{fontWeight:700,marginBottom:'.2rem',fontSize:'.8rem'}}>Import</div><input ref={fRef} type="file" accept=".json" onChange={impData} style={{display:'none'}}/><button className="btn btn-s" style={{marginTop:'.3rem'}} onClick={()=>fRef.current?.click()}>インポート</button></div></div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
